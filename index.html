<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple YIFY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="description" content="A simple and lightweight frontend to the YIFY API">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="shortcut icon" href="favicon.ico">
    <style type="text/css" media="screen">
        * { margin: 0; padding: 0; border: 0; box-sizing: border-box; font-family: "IBM Plex Sans", sans-serif; color: #e0e0e0; }
        html, body { width: 100%; height: 100%; }
        body { background-color: #171717; }
        header, h2, p, footer { text-align: center; }
        header { padding: 2.5rem 1rem 3rem 1rem; }
        header > a > img { width: 128px; }
        input, button, h2 { font-size: 1.16rem; font-weight: normal; }
        h2 a, a.arrow { text-decoration: none; }
        h2 a:hover { text-decoration: underline; }
        input, button, a.arrow { border-radius: 4px; }
        input, button, .error { padding: 0.25rem 0.5rem; }
        button:hover { color: #282828; background-color: #f90; }
        input, button, h2, ul, a.arrow { background-color: #282828; }
        input, button { height: 36px; }
        input { margin-top: 2rem; width: 100%; }
        button { margin-top: 1rem; width: 160px; cursor: pointer; }
        
        /* List Container */
        #list { display: flex; flex-wrap: wrap; padding: 1.5rem 0; background-color: #1d1d1d; border-top: 1px dashed #333; border-bottom: 1px dashed #333; min-height: 50vh; }
        
        /* Cards */
        section, p { width: 100%; }
        section { padding: 1rem; opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        ul { list-style: none; text-align: left; vertical-align: top; margin-bottom: 0.5rem; padding: 0.75rem 1rem; border-radius: 0 0 4px 4px; }
        li, p, footer { line-height: 1.6; }
        h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.5rem; padding: 0.5rem 1rem 0.66rem 1rem; border-radius: 4px 4px 0 0; }
        section img { width: 100%; display: block; aspect-ratio: 2/3; background-color: #171717; object-fit: cover; }
        
        /* Footer & Utils */
        #foot p { margin: 2rem 0; }
        #foot { padding: 0.5rem 1rem 1rem 1rem; }
        .up { text-transform: uppercase; }
        .error { background-color: #c44; display: inline-block; margin-top: 20px;}
        .disclaimer { background-color: #1d1d1d; padding: 1rem; border-radius: 4px; margin-top: 2rem; margin-bottom: 1rem; color: #999; }
        .disclaimer a { color: #999; }

        /* Loading Indicator */
        #loader { text-align: center; padding: 20px; display: none; width: 100%; }
        .spinner { border: 4px solid #333; border-top: 4px solid #f90; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsive Grid */
        @media screen and (min-width: 480px) { header { padding: 2.5rem 1.5rem 3rem 1.5rem; } input { max-width: 385px; } #list { padding: 1.5rem; } section { padding: 1rem 1.5rem; } #foot { padding: 0.5rem 1.5rem 1rem 1.5rem; } }
        @media screen and (min-width: 750px) { section { width: 50%; } }
        @media screen and (min-width: 1125px) { section { width: 33%; } }
        @media screen and (min-width: 1500px) { section { width: 25%; } }
        @media screen and (min-width: 1875px) { section { width: 20%; } }
        @media screen and (min-width: 2250px) { section { width: 16.66%; } }
    </style>
</head>
<body>
    <header>
        <a href="/"><img src="https://yify.website/logo-YTS.svg" alt="YTS Logo"></a>
        <form>
            <!-- Clean URL on submit -->
            <input type="text" name="movie" size="48" placeholder="" />
            <br />
            <button type="submit">Search</button>
        </form>
    </header>

    <div id="list"></div>
    
    <div id="loader"><div class="spinner"></div></div>

    <footer id="foot">
        <p id="status-text"></p>
        <p class="disclaimer">This website does not host any content. It is just a simple and lightweight frontend to the <a target='_blank' href='https://yts.lt/api'>YIFY Movies API</a>.</p>
    </footer>

    <script type="text/javascript">
        // --- STATE MANAGEMENT ---
        const urlParams = new URLSearchParams(window.location.search);
        let currentPage = parseInt(urlParams.get('page')) || 1;
        let isLoading = false;
        let hasMore = true;
        const searchTerm = urlParams.get('movie') || '';
        
        // --- CONFIGURATION ---
        // Construct the Base URL without the page parameter
        let baseUrl = "https://yts.lt/api/v2/list_movies.json?limit=50&sort_by=date_added";
        if (searchTerm) {
            baseUrl += "&query_term=" + encodeURIComponent(searchTerm);
            // Set input value to current search
            document.querySelector('input[name="movie"]').value = searchTerm;
        }

        // --- CORE FUNCTIONS ---

        function fetchMovies() {
            if (isLoading || !hasMore) return;
            
            isLoading = true;
            document.getElementById('loader').style.display = 'block';

            const fetchUrl = `${baseUrl}&page=${currentPage}`;

            fetch(fetchUrl)
                .then(response => response.json())
                .then(json => {
                    // Check if data exists
                    if (json.data && json.data.movies && json.data.movies.length > 0) {
                        renderMovies(json.data.movies);
                        
                        // Update UI Footer Stats
                        const loadedCount = (currentPage - 1) * json.data.limit + json.data.movies.length;
                        document.getElementById("status-text").innerHTML = 
                            `Showing ${loadedCount} of ${json.data.movie_count} movies. Scroll for more.`;

                        // Prepare for next page
                        currentPage++;
                        
                        // Check if we reached the end
                        if (loadedCount >= json.data.movie_count) {
                            hasMore = false;
                            document.getElementById("status-text").innerHTML = `${json.data.movie_count} movies found`;
                        }
                    } else {
                        // No results found at all or end of list
                        hasMore = false;
                        if(currentPage === 1) {
                             document.getElementById("list").innerHTML = "<p>No movies found</p>";
                        } else {
                             document.getElementById("status-text").innerHTML = `${json.data.movie_count} movies`;
                        }
                    }
                })
                .catch(err => {
                    console.error(err);
                    const errorMsg = "<p class='error'>Error fetching data. Please check your connection.</p>";
                    if(currentPage === 1) document.getElementById("list").innerHTML = errorMsg;
                    else document.getElementById("foot").insertAdjacentHTML('afterbegin', errorMsg);
                    hasMore = false; // Stop trying on error
                })
                .finally(() => {
                    isLoading = false;
                    document.getElementById('loader').style.display = 'none';
                });
        }

        function renderMovies(movies) {
            let htmlBuffer = "";
            
            movies.forEach(movie => {
                // Safety checks for missing data
                const title = movie.title_english || movie.title;
                const img = movie.large_cover_image || movie.medium_cover_image;
                const year = movie.year || '';
                const lang = movie.language ? `&nbsp;&middot;&nbsp;<span class='up'>${movie.language}</span>` : '';
                const runtime = movie.runtime ? `&nbsp;&middot;&nbsp;${movie.runtime}&nbsp;min` : '';
                const imdbLink = `https://www.imdb.com/title/${movie.imdb_code}`;
                const rating = movie.rating ? `:&nbsp;${movie.rating}` : '';
                
                // Torrent links construction
                let torrentsHtml = "";
                if (movie.torrents) {
                    movie.torrents.forEach(t => {
                        torrentsHtml += `<li>
                            <span class='up'>${t.type}</span>&nbsp;${t.quality}&nbsp;${t.video_codec || ''}&nbsp;${t.audio_channels || ''}
                            &middot;&nbsp;<a title='Download' href='${t.url}'>${t.size}</a>
                        </li>`;
                    });
                }

                // Append Card HTML
                htmlBuffer += `
                    <section>
                        <h2><a title='Permalink' href='?movie=${movie.imdb_code}'>${title}</a></h2>
                        <a target='_blank' href='${movie.url}'><img src='${img}' loading="lazy" /></a>
                        <ul>
                            <li>
                                ${year}${lang}${runtime}
                            </li>
                            <li>
                                <a target='_blank' href='${imdbLink}'>IMDb</a>${rating}
                                ${movie.yt_trailer_code ? `&middot;&nbsp;<a target='_blank' href='https://www.youtube.com/embed/${movie.yt_trailer_code}'>Trailer</a>` : ''}
                            </li>
                            ${torrentsHtml}
                        </ul>
                    </section>
                `;
            });

            // IMPORTANT: Append to existing list, do not overwrite
            document.getElementById("list").insertAdjacentHTML('beforeend', htmlBuffer);
        }

        // --- SCROLL HANDLER ---
        
        window.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            
            // Trigger fetch when user is 300px from the bottom
            if (scrollTop + clientHeight >= scrollHeight - 320) {
                fetchMovies();
            }
        });

        // --- INITIALIZATION ---
        // Start the first load immediately
        fetchMovies();

    </script>
    <!-- Privacy-first analytics -->
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>
</body>
</html>
